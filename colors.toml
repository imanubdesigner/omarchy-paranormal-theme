# Paranormal — a horror theme for Omarchy.
#
# The colours come from what paranormal, ghosts, asylum and horror actually
# look like: cold dark, sickly light, bone, ectoplasm, rust and old paper.
#
#   - the dark ramp drops below the wallpapers' own void, so windows sink into
#     the image instead of sitting on top of it as a rectangle
#   - the accent is the only light in the theme
#   - the warm tones are aged and low-chroma; a terminal still has to tell an
#     error from a warning, so they exist, but they never shout
#   - nothing here is brighter than chroma 0.051

mode = "dark"

accent              = "#97c0c4"   # ectoplasm: the only light
selection           = "#183f42"   # raised surface
muted               = "#6b7576"   # grey fog

background          = "#060a0a"   # cold black
dark_background     = "#030606"   # deep shade
darker_background   = "#020303"   # the void behind the glass
lighter_background  = "#0d1112"   # concrete wall

foreground          = "#c5cece"   # bone
dark_foreground     = "#5c6565"   # comments, dead text
light_foreground    = "#8c9696"   # secondary text
bright_foreground   = "#ebefef"   # apparition white

red                 = "#845e5f"   # clotted blood
yellow              = "#b3a381"   # ward paperwork
orange              = "#978867"   # tungsten lamp
green               = "#6b907f"   # asylum mist
cyan                = "#729b9e"   # spectral light
blue                = "#647e94"   # blue beyond the glass
magenta             = "#997483"   # bruised violet
brown               = "#736850"   # rotting wood

bright_red          = "#bc9294"   # fresh blood
bright_yellow       = "#ddcdaa"   # burnt page
bright_green        = "#9dc5b3"   # rotten apple
bright_cyan         = "#abd5d9"   # ectoplasm alight
bright_blue         = "#9ebad2"   # moonlight
bright_magenta      = "#cba4b3"   # polyp pink