# Paranormal — tema horror per Omarchy.
#
# colors.toml e' la sorgente: gli sfondi in backgrounds/ sono stati ricolorati
# con questa palette, quindi non va richiesto a loro di derivarla — sarebbe
# circolare. tools/gen_colors.py ricostruisce i colori in OKLCh, li riporta
# nel gamut sRGB e verifica contrasti e rampa; gli sfondi servono solo come
# controllo di famiglia.
#
#   - la rampa scende sotto il vuoto degli sfondi (Y~0.006): le finestre si
#     perdono nel buio invece di staccarsi come un rettangolo.
#   - l'accento e' l'unica accensione a 9.7:1 sul fondo.
#   - rosso, giallo, arancio, magenta e maronio non esistono negli sfondi: sono
#     eccezioni dichiarate, a cromo contenuto, perche' un terminale deve
#     distinguere un errore da un avviso.
#
# Rigenera con:  python3 tools/gen_colors.py

